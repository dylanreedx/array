name: Continuum
options:
  bundleIdPrefix: dev.dylanreedx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 46TTB6J9DZ
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2026070802
    MARKETING_VERSION: 0.1.0
targets:
  Continuum:
    type: application
    platform: iOS
    sources: [Continuum/Sources]
    dependencies:
      - package: continuum-revived
        product: ContinuumRevivedCore
      - package: continuum-revived
        product: ContinuumRevivedSync
    info:
      path: Continuum/Resources/Info.plist
      properties:
        CFBundleDisplayName: Continuum
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: dev.dylanreedx.continuum.pairing
            CFBundleURLSchemes:
              - continuum
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Continuum uses the camera to scan a Mac pairing QR code.
        NSLocalNetworkUsageDescription: Continuum uses your local network to pair this iPhone with your Mac.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dylanreedx.continuum
        CODE_SIGN_ENTITLEMENTS: Continuum/Resources/Continuum.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  continuum-revived:
    path: ..
