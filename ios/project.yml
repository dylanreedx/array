name: Continuum
options:
  bundleIdPrefix: dev.dylanreed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 46TTB6J9DZ
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Continuum:
    type: application
    platform: iOS
    sources: [Continuum/Sources]
    dependencies:
      - package: continuum-revived
        product: ContinuumRevivedCore
      - package: continuum-revived
        product: ContinuumRevivedSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dylanreed.continuum
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Continuum/Resources/Continuum.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Continuum
packages:
  continuum-revived:
    path: ..
