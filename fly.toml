app = "arrayapp-relay"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RELAY_HOST = "::"
  RELAY_ADMIN_PORT = "9090"
  RELAY_DATABASE_PATH = "/data/relay.sqlite"

[[mounts]]
  source = "relay_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
