<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src array-task-image:; connect-src 'none'"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="editor.css"></head><body role="dialog" aria-modal="true" aria-label="Task details">
<header><span class="eyebrow">TASK DETAILS</span><span id="save-status" role="status">Saved</span><button id="close" aria-label="Close task">×</button></header>
<main><section class="document"><input id="title" placeholder="Task title" aria-label="Task title"><label class="section-label">Description</label>
<div id="toolbar" role="toolbar" aria-label="Text formatting"><button data-command="bold" aria-label="Bold"><b>B</b></button><button data-command="italic" aria-label="Italic"><i>I</i></button><button data-command="strike" aria-label="Strikethrough"><s>S</s></button><span></span><button data-command="heading" aria-label="Heading">H</button><button data-command="bulletList" aria-label="Bullet list">• List</button><button data-command="orderedList" aria-label="Numbered list">1. List</button><button data-command="taskList" aria-label="Checklist">☑</button><button data-command="blockquote" aria-label="Quote">❝</button><button data-command="codeBlock" aria-label="Code block">&lt;/&gt;</button><button data-command="link" aria-label="Add link">Link</button><button data-command="image" aria-label="Insert image">Image</button></div>
<div id="editor"></div><div id="error" role="alert" hidden></div><div id="conflict" hidden><button id="reload">Use latest saved version</button><button id="keep">Save my version</button></div>
<div class="attachments-header"><label class="section-label">Images <span id="image-count"></span></label><button id="add-images">＋ Add images</button></div><div id="gallery" aria-label="Task images"></div><p id="image-hint">Drop screenshots here, or paste an image into the description.</p></section>
<aside><label class="section-label" id="status-label">Status</label><div class="select-shell"><button id="status" class="select-trigger" aria-labelledby="status-label status-value" aria-haspopup="listbox" aria-expanded="false"><span id="status-value">Choose status</span><svg class="choice-chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4 6 1.5 9 4M3 8 6 10.5 9 8"/></svg></button><div id="status-picker" class="select-popover" role="listbox" aria-labelledby="status-label" hidden><div id="status-options" class="select-options"></div></div></div><label class="section-label" id="assignee-label">Assignee</label><div class="select-shell"><button id="assignee" class="select-trigger" aria-labelledby="assignee-label assignee-value" aria-haspopup="listbox" aria-expanded="false"><span id="assignee-value">Assign agent</span><svg class="choice-chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4 6 1.5 9 4M3 8 6 10.5 9 8"/></svg></button><div id="agent-picker" class="select-popover" role="listbox" aria-labelledby="assignee-label" hidden><input id="agent-search" placeholder="Search agents…" aria-label="Search agents"><div id="agent-options" class="select-options"></div><button id="create-agent" class="select-footer">＋ Create agent</button></div></div><p class="muted" id="assignment-note">The task appears in the assigned agent’s prompt box. Sending stays explicit.</p></aside></main>
<div id="image-preview" hidden role="dialog" aria-label="Image preview"><button id="close-image" aria-label="Close image preview">×</button><img alt="Task attachment"></div>
<script src="editor.js"></script></body></html>
